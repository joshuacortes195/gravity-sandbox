# the web app lives in web/, netlify builds it there and serves what vite writes to dist
# the wasm files are committed, so the build only needs node, not emscripten
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# the two headers that make every page cross-origin isolated, which browsers require before
# they hand out shared memory for threads. vite.config.ts sends the same ones locally
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
